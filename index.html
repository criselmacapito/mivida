<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Para ti ♥</title>
<style>
  html, body { margin: 0; height: 100%; background: rgb(223, 158, 209); overflow: hidden; font-family: Georgia, "Times New Roman", serif; }
  canvas { display: block; position: fixed; inset: 0; }
  #intro {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #ff8fa3; cursor: pointer; transition: opacity 1s; -webkit-tap-highlight-color: transparent;
  }
  #intro .h { font-size: 72px; color: #ff2e63; animation: latido 1.2s infinite; }
  #intro p { font-style: italic; font-size: 20px; letter-spacing: 1px; margin-top: 18px; opacity: .85; }
  @keyframes latido { 0%,100%{transform:scale(1)} 15%{transform:scale(1.18)} 30%{transform:scale(1)} 45%{transform:scale(1.08)} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro"><div class="h">♥</div><p>Toca para abrir</p></div>

<script>
// ===================== PERSONALIZA AQUÍ =====================
const PARA    = "Para ti pez mi brenchiii";
const MENSAJE = "No soy el mejor con las palabras brenchi,\n" +
                "así que aprendí a hacer este corazón para ti, no es muy profesional pero.\n" +
                "Cada puntito que ves late por ti jaja, y quisiera poner mas pero se lagea p";
const FIRMA   = "firma, yo p, Cristiano";
// ============================================================

const COLORES = ["#ff2e63", "#ff4d6d", "#ff758f", "#ff0a54", "#ff8fa3", "#c9184a"];
const FRAMES_DIBUJO = 90;   // cuánto tarda en dibujarse el contorno
const VELOCIDAD_MS  = 30;   // milisegundos por cuadro

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H, CX, CY, S, DPR;

function medir() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H * 0.40;
  S = Math.min(W / 38, H / 46);          // tamaño del corazón
}
medir();
window.addEventListener("resize", medir);

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// Fórmula del corazón (en unidades, y hacia arriba)
function corazon(t) {
  return [16 * Math.sin(t) ** 3,
          13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
}
const aPantalla = (ux, uy, f = 1) => [CX + ux * S * f, CY - uy * S * f];

// ---------- Estrellas ----------
const estrellas = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), s: rand(1, 2.5), b: rand(.15, .6) }));

// ---------- Partículas (en unidades del corazón) ----------
const particulas = [];
function hacia_adentro(ux, uy, fuerza) {
  const r = -fuerza * Math.log(1 - Math.random());
  return [ux * (1 - r), uy * (1 - r)];
}
for (let i = 0; i < 1100; i++) {                       // borde
  const [ux, uy] = corazon(rand(0, Math.PI * 2));
  particulas.push({ x: ux + rand(-.12, .12), y: uy + rand(-.12, .12), s: rand(1.8, 3.4), c: pick(COLORES) });
  for (let j = 0; j < 2; j++) {                         // relleno cerca del borde
    const [nx, ny] = hacia_adentro(ux, uy, 0.17);
    particulas.push({ x: nx, y: ny, s: rand(1.2, 2.6), c: pick(COLORES) });
  }
}
for (let i = 0; i < 700; i++) {                        // relleno del centro
  const [ux, uy] = corazon(rand(0, Math.PI * 2));
  const [nx, ny] = hacia_adentro(ux, uy, 0.4);
  particulas.push({ x: nx, y: ny, s: rand(1, 2.2), c: pick(COLORES) });
}
const halo = Array.from({ length: 450 }, () => pick(COLORES));

// ---------- Corazoncitos flotando ----------
const flotantes = [];

// ---------- Utilidades de texto ----------
function mezclar(c1, c2, t) {
  t = Math.max(0, Math.min(1, t));
  const a = [1, 3, 5].map(i => parseInt(c1.substr(i, 2), 16));
  const b = [1, 3, 5].map(i => parseInt(c2.substr(i, 2), 16));
  return "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",") + ")";
}
function partirLineas(texto, maxAncho) {
  const out = [];
  for (const parrafo of texto.split("\n")) {
    let linea = "";
    for (const palabra of parrafo.split(" ")) {
      const prueba = linea ? linea + " " + palabra : palabra;
      if (ctx.measureText(prueba).width > maxAncho && linea) { out.push(linea); linea = palabra; }
      else linea = prueba;
    }
    out.push(linea);
  }
  return out;
}

// ---------- Dibujo por cuadro ----------
function dibujar(frame) {
  ctx.fillStyle = "#ffc0cb"; ctx.fillRect(0, 0, W, H);

  // estrellas que titilan
  for (const e of estrellas) {
    if (Math.random() < 0.05) e.b = pick([.1, .3, .6, 1]);
    ctx.fillStyle = `rgba(255,255,255,${e.b})`;
    ctx.beginPath(); ctx.arc(e.x * W, e.y * H, e.s / 2, 0, Math.PI * 2); ctx.fill();
  }

  // Fase 1: contorno dibujándose
  if (frame < FRAMES_DIBUJO) {
    const total = (frame + 1) * 2;
    for (let i = 0; i < total; i++) {
      const [ux, uy] = corazon(i / (FRAMES_DIBUJO * 2) * Math.PI * 2);
      const [x, y] = aPantalla(ux, uy);
      ctx.fillStyle = "rgba(255,46,99,0.25)"; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff4d6d";              ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
    }
    return;
  }

  // Fase 2: explosión + latido
  const k = frame - FRAMES_DIBUJO;
  const aparicion = Math.min(1, k / 35);
  const ease = 1 - (1 - aparicion) ** 3;
  const ciclo = (k % 40) / 40;
  const pulso = 1 + 0.09 * Math.exp(-(((ciclo - 0.15) / 0.06) ** 2))
                  + 0.05 * Math.exp(-(((ciclo - 0.38) / 0.06) ** 2));
  const f = ease * pulso;

  // corazoncitos flotando (detrás)
  if (k % 6 === 0) flotantes.push({ x: rand(0, W), y: H + 30, v: rand(1.5, 4), fase: rand(0, 6.28), tam: rand(12, 34), c: pick(COLORES) });
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let i = flotantes.length - 1; i >= 0; i--) {
    const p = flotantes[i];
    p.x += Math.sin(k / 15 + p.fase) * 1.2; p.y -= p.v;
    if (p.y < -40) { flotantes.splice(i, 1); continue; }
    ctx.fillStyle = p.c; ctx.globalAlpha = 0.7;
    ctx.font = `${p.tam}px Arial`; ctx.fillText("♥", p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // resplandor detrás del corazón
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 20 * S * f + 1);
  g.addColorStop(0, `rgba(255,10,84,${0.22 * ease * (pulso - 0.6)})`);
  g.addColorStop(1, "rgba(255,10,84,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // partículas
  const tamBase = Math.max(0.7, S / 17);
  for (const p of particulas) {
    const [x, y] = aPantalla(p.x, p.y, f);
    const s = p.s * tamBase;
    ctx.fillStyle = p.c;
    ctx.fillRect(x + rand(-.8, .8), y + rand(-.8, .8), s, s);
  }
  // halo
  for (const c of halo) {
    const [ux, uy] = corazon(rand(0, Math.PI * 2));
    const [x, y] = aPantalla(ux, uy, rand(1.08, 1.3) * f);
    ctx.fillStyle = c;
    ctx.fillRect(x + rand(-10, 10), y + rand(-10, 10), 2, 2);
  }

  // textos
  const tamTitulo = Math.min(H / 14, W / 9);
  ctx.font = `italic bold ${tamTitulo}px Georgia, serif`;
  ctx.fillStyle = mezclar("#000000", "#ff4d6d", (k - 15) / 45);
  ctx.fillText(PARA, CX, Math.max(tamTitulo * 0.9, CY - 17 * S * 1.35));

  if (k >= 50) {
    const n = Math.floor((k - 50) / 2);
    const tam = Math.min(H / 30, W / 20);
    ctx.font = `italic ${tam}px Georgia, serif`;
    ctx.fillStyle = "#ffffff";
    const lineas = partirLineas(MENSAJE.slice(0, n), W * 0.9);
    let y = Math.min(H * 0.80, CY + 17 * S * 1.25 + tam);
    for (const l of lineas) { ctx.fillText(l, CX, y); y += tam * 1.35; }

    if (n > MENSAJE.length) {
      ctx.font = `italic bold ${tam * 1.05}px Georgia, serif`;
      ctx.fillStyle = mezclar("#000000", "#ff8fa3", (n - MENSAJE.length) / 30);
      ctx.fillText(FIRMA, CX, Math.max(y + tam * 0.6, H * 0.95));
    }
  }
}

// ---------- Inicio: tocar para abrir ----------
let inicio = null;
function loop(ahora) {
  if (inicio === null) inicio = ahora;
  dibujar(Math.floor((ahora - inicio) / VELOCIDAD_MS));
  requestAnimationFrame(loop);
}
const intro = document.getElementById("intro");
intro.addEventListener("click", () => {
  intro.style.opacity = 0;
  setTimeout(() => intro.remove(), 1000);
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
